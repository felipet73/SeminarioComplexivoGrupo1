name: Pruebas Grupo 1

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evaluar_modelo_real:
        description: Ejecutar evaluaciones con proveedores reales y consumo de API
        type: boolean
        default: false

jobs:
  secretos:
    name: Revisar secretos con Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear todo el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: "--all"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Detectar también credenciales fijas de baja entropía en código activo
        run: python scripts/check_secrets.py
      - name: Impedir reintroducción del módulo legacy en el historial
        run: python scripts/check_secrets.py --historial-legacy

  backend:
    runs-on: ubuntu-latest
    # El CI normal valida contratos con dobles, sin consumir proveedores.
    # Las claves solo se utilizan en el job manual evaluacion-real.
    env:
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: python -m pip install --upgrade pip

      - run: pip install --no-cache-dir -r backend/requirements-dev.txt

      - run: ruff check backend scripts eval

      - run: python scripts/check_secrets.py

      - run: python -m pytest -q backend/tests --cov=app --cov-fail-under=85 --cov-report=xml --junitxml=eval/tests-backend.xml
        env:
          PYTHONPATH: backend

      - run: python scripts/ingest.py --data-dir data/eval-state --strategy lexical

      - run: python eval/evaluar.py

      - run: python eval/evaluar_flujo.py

      - run: pip-audit --local --format=json --output eval/results-auditoria-python.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluacion-rag
          path: |
            eval/results*.json
            coverage.xml
            eval/tests-backend.xml

  postgres:
    name: Persistencia PostgreSQL aislada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      RAG_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r backend/requirements.txt
      - name: Reiniciar procesos y PostgreSQL, migrar sin serialize y repetir golden set
        run: python scripts/probar_postgres.py --with-corpus --report eval/persistencia-postgres.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistencia-postgres
          path: eval/persistencia-postgres.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm audit --audit-level=high

  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m venv backend/.venv

      - run: backend/.venv/bin/pip install --upgrade pip

      - run: backend/.venv/bin/pip install --no-cache-dir -r backend/requirements.txt

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:admin
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: navegador-fallos
          path: frontend/test-results/

  evaluacion-real:
    if: github.event_name == 'workflow_dispatch' && inputs.evaluar_modelo_real
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: pip install --no-cache-dir -r backend/requirements.txt

      - name: Verificar secreto de embeddings
        run: |
          python -c "import os; assert os.environ.get('OPENAI_API_KEY'), 'Configura el secreto OPENAI_API_KEY del repositorio'"

      - run: python -u eval/comparar.py --embedding-model text-embedding-3-small

      - run: python eval/evaluar.py --data-dir data/eval-hybrid --chat --prompt system_v3 --output eval/results-chat.json

      - name: Evaluar agente real, elección y seis listas con citas
        run: python -u eval/evaluar_agente_real.py --modelo gemini --output eval/results-agente-real.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluacion-real
          path: eval/results*.json

  contenedor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen sin credenciales de modelos
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -f backend/Dockerfile -t titulacion-rag:ci .

      - name: Probar arranque, corpus y contrato HTTP
        run: |
          docker run -d --name titulacion-rag-ci -p 8080:8080 -e PORT=8080 titulacion-rag:ci
          python scripts/smoke_container.py --url http://127.0.0.1:8080 --expected-revision "$GITHUB_SHA"

      - name: Recrear instancias sin volumen y verificar la semilla citada
        run: python scripts/verificar_reinicio_contenedor.py --image titulacion-rag:ci --expected-revision "$GITHUB_SHA" --report eval/reinicio-contenedor.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reinicio-contenedor
          path: eval/reinicio-contenedor.json
          if-no-files-found: warn

      - name: Logs del contenedor
        if: always()
        run: docker logs titulacion-rag-ci || true

      - name: Conservar exactamente la imagen probada para su despliegue
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save titulacion-rag:ci | gzip > /tmp/backend-image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp/backend-image.tar.gz
          retention-days: 1

  desplegar:
    needs: [secretos, backend, frontend, navegador, contenedor, postgres]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      GCP_SERVICE: titulacion-rag
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      JSON_AUTH_PRESENT: ${{ secrets.GCP_SA_KEY != '' }}
      BACKEND_URL: https://titulacion-rag-386902880383.us-central1.run.app
      FRONTEND_URL: https://seminario-complexivo-grupo1.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración de despliegue
        run: |
          python - <<'PY'
          import os
          for key in ('GCP_PROJECT_ID', 'GCP_AR_REPOSITORY'):
              assert os.environ.get(key), f'Configura la variable {key} en GitHub'
          if os.environ.get('WIF_PROVIDER'):
              assert os.environ.get('WIF_ACCOUNT'), 'Configura GCP_SERVICE_ACCOUNT para WIF'
          else:
              assert os.environ.get('JSON_AUTH_PRESENT') == 'true', 'Configura WIF o el secreto GCP_SA_KEY'
          PY
      - uses: google-github-actions/auth@v3
        if: env.WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_ACCOUNT }}
      - uses: google-github-actions/auth@v3
        if: env.WIF_PROVIDER == ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp/imagen
      - name: Publicar imagen probada con etiqueta del commit
        id: imagen
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker load --input /tmp/imagen/backend-image.tar.gz
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_AR_REPOSITORY/$GCP_SERVICE:$GITHUB_SHA"
          docker tag titulacion-rag:ci "$image"
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/deploy-cloudrun@v3
        id: deploy
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.GCP_SERVICE }}
          image: ${{ steps.imagen.outputs.uri }}
          env_vars_update_strategy: merge
          env_vars: |
            APP_REVISION=${{ github.sha }}
            APP_ENV=production
            CORS_ORIGINS=${{ env.FRONTEND_URL }}
            ADMIN_COOKIE_SECURE=true
          flags: --memory=1Gi --max-instances=1 --min-instances=0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar revisión, corpus, rutas retiradas y chat
        run: python scripts/smoke_container.py --url "$BACKEND_URL" --expected-revision "$GITHUB_SHA"
      - name: Casos funcionales contra las URLs públicas
        run: python scripts/pruebas_funcionales.py --backend "$BACKEND_URL" --frontend "$FRONTEND_URL" --expected-revision "$GITHUB_SHA" --incluir-modelo --output eval/results-produccion-funcional.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-despliegue-${{ github.sha }}
          path: eval/results-produccion*.json
