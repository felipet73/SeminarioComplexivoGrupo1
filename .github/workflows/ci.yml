name: Pruebas Grupo 1
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install --no-cache-dir -r backend/requirements-dev.txt
      - run: ruff check backend scripts eval
      - run: python scripts/check_secrets.py
      - run: python -m pytest -q backend/tests --cov=app --cov-fail-under=85 --cov-report=xml
        env:
          PYTHONPATH: backend
      - run: python scripts/ingest.py --data-dir data/eval-state --strategy lexical
      - run: python eval/evaluar.py
      - run: python eval/evaluar_flujo.py
      - run: pip-audit -r backend/requirements.lock.txt --disable-pip --no-deps --format=json --output eval/results-auditoria-python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluacion-rag
          path: |
            eval/results*.json
            coverage.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv backend/.venv
      # MODIFICACIÓN CLAVE AQUÍ: Añadido --no-cache-dir para forzar bcrypt==3.2.2 limpio
      - run: backend/.venv/bin/pip install --upgrade pip
      - run: backend/.venv/bin/pip install --no-cache-dir -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:admin
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: navegador-fallos
          path: frontend/test-results/
  evaluacion-real:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install --no-cache-dir -r backend/requirements.txt
      - name: Verificar secreto de embeddings
        run: python -c "import os; assert os.environ.get('OPENAI_API_KEY'), 'Configura el secreto OPENAI_API_KEY del repositorio'"
      - run: python -u eval/comparar.py --embedding-model text-embedding-3-small
      - run: python eval/evaluar.py --data-dir data/eval-hybrid --chat --prompt system_v3 --output eval/results-chat.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluacion-real
          path: eval/results*.json